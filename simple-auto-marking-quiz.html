<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P4 English Grammar Quiz - Auto-Marking</title>
  <style>
    body { font-family: Arial; background: #f0f4f8; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 30px; }
    h1 { text-align: center; color: #2f6fed; }
    .q-box { margin-bottom: 25px; border-left: 4px solid var(--primary); padding: 15px; background: #f8fafc; }
    .q-title { font-weight: bold; font-size: 1.2rem; color: #2f6fed; margin-bottom: 10px; }
    .options { display: grid; gap: 10px; }
    .option { padding: 15px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
    .option:hover:not(.disabled) { background: #e8f3ff; border-color: var(--primary); }
    .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .feedback { display: none; margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; }
    .feedback.correct { background: #d4edda; color: #155724; }
    .feedback.incorrect { background: #f8d7da; color: #721c24; }
    .next-btn { display: none; margin-top: 15px; padding: 10px 30px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; }
    .next-btn:hover { background: #1a58d0; }
    .progress { text-align: center; font-weight: bold; margin-bottom: 20px; color: var(--muted); }
    .result { display: none; text-align: center; padding: 30px; }
    .score { font-size: 2.5rem; color: var(--primary); font-weight: bold; }
    :root { --primary: #2f6fed; --border: #dbe3ef; --text: #1f2937; --muted: #6b7280; }
  </style>
</head>
<body>
<div class="container">
  <h1>🇸🇬 P4 English Grammar Quiz</h1>
  <div class="progress" id="progress"></div>
  
  <div id="quiz-area">
    <div class="q-box" id="question-container">
      <div class="q-title" id="q-text"></div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" onclick="nextQuestion()" id="next-btn">Next Question →</button>
    </div>
  </div>

  <div class="result" id="result-box">
    <h2>🎉 Quiz Completed!</h2>
    <div class="score" id="final-score"></div>
    <p id="feedback-text"></p>
    <button onclick="restartQuiz()">Try Again 🔄</button>
  </div>
  
</div>

<script>
const questions = [
  // MCQ - Grammar Multiple Choice
  { type: "mcq", text: "MCQ: Choose the correct verb. The students _______ their books before class.", options: ["opens", "open", "opening"], answer: 1, explanation: "'Open' agrees with the plural subject 'students'." },
  
  // MCQ - Articles
  { type: "mcq", text: "MCQ: We saw _______ rainbow after the rain.", options: ["a", "an", "some"], answer: 0, explanation: "Use 'a' before a word that begins with a consonant sound." },
  
  // Cloze - Fill in blank with word bank
  { type: "cloze", text: "Cloze: Complete the sentence. Maya _______ (visit) her grandmother last Sunday.", options: ["visits", "visited", "visiting"], answer: 1, explanation: "'Visited' is the past-tense verb for an action that happened last Sunday." },
  
  // Editing - Spot the error
  { type: "editing", text: "Editing: Which sentence has an error?", options: ["The baby is sleeping.", "My brother brush his teeth.", "We walk to school."], answer: 1, explanation: "The sentence should say 'brushes' because 'my brother' is singular." },
  
  // Sentence Combining - Join sentences
  { type: "combining", text: "Sentence Combining: Join these ideas using 'because'. 'Lina brought an umbrella.' + 'The clouds were dark.'", options: ["Lina brought an umbrella because the clouds were dark.", "Because Lina brought an umbrella, the clouds were dark.", "Lina brought because an umbrella the clouds were dark."], answer: 0, explanation: "'Because' gives the reason Lina brought an umbrella." },
  
  // MCQ - Pronouns
  { type: "mcq", text: "MCQ: Sarah and _______ are preparing the display.", options: ["me", "I", "my"], answer: 1, explanation: "'I' is the subject pronoun used with 'Sarah' before the verb." },
  
  // Cloze - Past tense
  { type: "cloze", text: "Cloze: The wind _______ (blow) strongly last night.", options: ["blows", "blew", "blowing"], answer: 1, explanation: "'Blew' is the past tense of 'blow'." },
  
  // Editing - Capitalization
  { type: "editing", text: "Editing: Choose the correctly capitalised sentence.", options: ["we visited Singapore in June.", "We visited singapore in June.", "We visited Singapore in June."], answer: 2, explanation: "The first word and the proper noun 'Singapore' must begin with capital letters." },
  
  // Sentence Combining - Relative clause
  { type: "combining", text: "Sentence Combining: Join using 'which'. 'I found a shell.' + 'It was very smooth.'", options: ["I found a shell which was very smooth.", "I found a shell which it was very smooth.", "I found which a shell was very smooth."], answer: 0, explanation: "'Which' can introduce extra information about the shell without repeating 'it'." },
  
  // MCQ - Adjectives vs Adverbs
  { type: "mcq", text: "MCQ: Choose the adverb. The tortoise moved _______.", options: ["slow", "slowly", "slowness"], answer: 1, explanation: "'Slowly' is an adverb that tells how the tortoise moved." },
  
  // MCQ - Prepositions
  { type: "mcq", text: "MCQ: The keys are _______ the drawer.", options: ["on", "in", "between"], answer: 1, explanation: "'In' shows that the keys are inside the drawer." },
  
  // Cloze - Plural nouns
  { type: "cloze", text: "Cloze: Choose the correct plural. One mouse, two _______.", options: ["mouses", "mouse", "mice"], answer: 2, explanation: "'Mice' is the irregular plural of 'mouse'." },
  
  // Editing - Verb tense
  { type: "editing", text: "Editing: Correct the sentence. They was excited about the trip.", options: ["They were excited about the trip.", "They are excited about the trip yesterday.", "They be excited about the trip."], answer: 0, explanation: "Use 'were' with the plural subject 'they'." },
  
  // Sentence Combining - Time clause
  { type: "combining", text: "Sentence Combining: Join using 'before'. I packed my bag. I left for school.", options: ["I packed my bag before I left for school.", "I left before I packed my bag for school.", "Before I left my bag packed for school."], answer: 0, explanation: "'Before' shows that packing the bag happened first." },
  
  // MCQ - Question words
  { type: "mcq", text: "MCQ: Which question word asks about a reason?", options: ["Why", "Who", "Where"], answer: 0, explanation: "'Why' asks for a reason." },
  
  // Cloze - Continuous tense
  { type: "cloze", text: "Cloze: We _______ (watch) a nature programme at the moment.", options: ["watch", "watched", "are watching"], answer: 2, explanation: "'Are watching' shows an action happening now." },
  
  // Editing - Spelling
  { type: "editing", text: "Editing: Choose the correctly spelt word.", options: ["becaus", "because", "becouse"], answer: 1, explanation: "'Because' is the correct spelling." },
  
  // Sentence Combining - Conditional
  { type: "combining", text: "Sentence Combining: Join using 'if'. 'We leave early.' + 'We will catch the bus.'", options: ["If we leave early, we will catch the bus.", "If we will catch the bus, we leave early.", "We leave if early the bus will catch."], answer: 0, explanation: "'If' introduces the condition that makes catching the bus possible." },
  
  // MCQ - Conjunctions
  { type: "mcq", text: "MCQ: I wanted to play outside, _______ it started to rain.", options: ["and", "but", "so"], answer: 1, explanation: "'But' joins two ideas that contrast with each other." },
  
  // Cloze - Possessive adjectives
  { type: "cloze", text: "Cloze: Fill in the blank. The children packed _______ lunch boxes.", options: ["they", "them", "their"], answer: 2, explanation: "'Their' shows that the lunch boxes belong to the children." },
  
  // MCQ - Past tense irregular verb
  { type: "mcq", text: "MCQ: We _______ a delicious cake for the party yesterday.", options: ["make", "made", "making"], answer: 1, explanation: "'Made' is the past tense of 'make'." },

  // Additional questions if needed
  { type: "mcq", text: "MCQ: Which sentence is complete?", options: ["Under the old bridge.", "Because the bell rang.", "The pupils lined up quietly."], answer: 2, explanation: "'The pupils' (subject) and 'lined up' (verb) make a complete sentence." },
  
  { type: "editing", text: "Editing: Find the correctly written sentence.", options: ["The boys was playing football.", "The boys were playing football.", "The boys were play football."], answer: 1, explanation: "Use 'were playing' with the plural subject 'boys'." },
  
  { type: "combining", text: "Sentence Combining: Join using 'and'. 'Nadia washed the vegetables.' + 'Nadia chopped them.'", options: ["Nadia washed and chopped the vegetables.", "Nadia washed the vegetables and chopped them.", "Both A and B are correct."], answer: 2, explanation: "Both sentences correctly join the two actions with 'and'." },
  
  { type: "cloze", text: "Cloze: The puppies _______ (be) asleep in their basket.", options: ["is", "am", "are"], answer: 2, explanation: "'Are' agrees with the plural subject 'puppies'." }
];

let qIndex = 0;
let score = 0;

function loadQuestion() {
  document.getElementById('progress').textContent = 'Question ' + (qIndex + 1) + ' of ' + questions.length;
  const q = questions[qIndex];
  
  document.getElementById('q-text').textContent = q.text;
  const container = document.getElementById('options');
  container.innerHTML = '';
  
  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => checkAnswer(i, div);
    container.appendChild(div);
  });
  
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('feedback').style.display = 'none';
}

function checkAnswer(selectedIndex, element) {
  const q = questions[qIndex];
  const opts = document.querySelectorAll('.option');
  
  opts.forEach(o => o.classList.add('disabled'));
  
  if (selectedIndex === q.answer) {
    score++;
    element.classList.add('correct');
    document.getElementById('feedback').style.display = 'none';
  } else {
    element.classList.add('wrong');
    opts[q.answer].classList.add('correct');
    document.getElementById('feedback').className = 'feedback incorrect';
    document.getElementById('feedback').textContent = q.explanation;
    document.getElementById('feedback').style.display = 'block';
  }
  
  document.getElementById('next-btn').style.display = 'inline-block';
}

function nextQuestion() {
  qIndex++;
  if (qIndex < questions.length) loadQuestion();
  else showResults();
}

function showResults() {
  const percent = (score / questions.length) * 100;
  let msg = '';
  
  if (percent === 100) msg = 'Perfect! Amazing grammar skills! ⭐⭐⭐';
  else if (percent >= 75) msg = 'Great job! Excellent work! 👍';
  else if (percent >= 50) msg = 'Good effort! Keep practicing! 💪';
  else msg = 'Keep studying and you will improve! 📚';
  
  document.getElementById('result-box').style.display = 'block';
  document.getElementById('final-score').textContent = score + ' / ' + questions.length;
  document.getElementById('feedback-text').textContent = msg;
}

function restartQuiz() {
  qIndex = 0;
  score = 0;
  document.getElementById('result-box').style.display = 'none';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
