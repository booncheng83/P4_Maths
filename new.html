<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ohm's Law Calculator</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #e74c3c;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3ef;
      --input: #fdf2f2;
      --accent: #ffe6e6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #ffe0e0, #fff0f0);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: min(100%, 620px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(231, 76, 60, 0.18);
      padding: 28px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 2vw, 2.5rem);
      color: var(--primary);
      text-align: center;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .formula {
      background: var(--accent);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.95rem;
      color: var(--text);
      font-weight: 600;
    }

    .field input,
    .field select {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(231, 76, 60, 0.18);
    }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    button.secondary {
      background: #eef2f7;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .result {
      margin-top: 24px;
      background: #f9fbff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      font-size: 1.05rem;
      color: var(--text);
    }

    .result strong {
      color: var(--primary);
    }

    @media (max-width: 540px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ohm's Law</h1>
    <p class="subtitle">Calculate voltage, current, resistance, or power.</p>

    <div class="formula">V = I × R</div>

    <div class="grid">
      <div class="field">
        <label for="quantity">Quantity to calculate</label>
        <select id="quantity">
          <option value="voltage">Voltage (V)</option>
          <option value="current">Current (I)</option>
          <option value="resistance">Resistance (R)</option>
          <option value="power">Power (P)</option>
        </select>
      </div>

      <div class="field">
        <label for="unit">Unit</label>
        <select id="unit">
          <option value="base">Base units</option>
          <option value="milli">Milli units (m)</option>
          <option value="kilo">Kilo units (k)</option>
        </select>
      </div>

      <div class="field">
        <label for="value1">Value 1</label>
        <input id="value1" type="number" step="any" placeholder="Enter first value" />
      </div>

      <div class="field">
        <label for="value2">Value 2</label>
        <input id="value2" type="number" step="any" placeholder="Enter second value" />
      </div>
    </div>

    <div class="actions">
      <button id="calculate">Calculate</button>
      <button id="clear" class="secondary" type="button">Clear</button>
    </div>

    <div class="result" id="result">
      <strong>Result:</strong> Choose values and press calculate.
    </div>
  </div>

  <script>
    const quantity = document.getElementById('quantity');
    const unit = document.getElementById('unit');
    const value1 = document.getElementById('value1');
    const value2 = document.getElementById('value2');
    const resultBox = document.getElementById('result');

    function applyUnit(value, selectedUnit) {
      switch (selectedUnit) {
        case 'milli': return value / 1000;
        case 'kilo': return value * 1000;
        default: return value;
      }
    }

    function formatNumber(n) {
      if (!Number.isFinite(n)) return 'Invalid';
      return Math.abs(n) >= 1000 || (Math.abs(n) > 0 && Math.abs(n) < 0.001)
        ? n.toExponential(4)
        : n.toFixed(4).replace(/\.0+$|(?<=\.\d)0+$/g, '');
    }

    function calculate() {
      const q = quantity.value;
      const selectedUnit = unit.value;
      const a = parseFloat(value1.value);
      const b = parseFloat(value2.value);

      if ([a, b].some(v => v === null || Number.isNaN(v))) {
        resultBox.innerHTML = '<strong>Result:</strong> Please enter valid numeric values.';
        return;
      }

      const v1 = applyUnit(a, selectedUnit);
      const v2 = applyUnit(b, selectedUnit);

      let output = '';
      const resultClass = 'result-success';

      if (!v1 || !v2) {
        output = '<span class="error">Please enter both values to calculate.</span>';
        resultBox.innerHTML = `<strong>Result:</strong> ${output}`;
        return;
      }

      if (q === 'voltage') {
        const voltage = v1 * v2;
        output = `Voltage = Current × Resistance = <span class="value">${formatNumber(v1)} A</span> × <span class="value">${formatNumber(v2)} Ω</span> = <strong>${formatNumber(voltage, 4)} V</strong>`;
      }

      if (q === 'current') {
        const current = v1 / v2;
        output = `Current = Voltage ÷ Resistance = <span class="value">${formatNumber(v1)} V</span> ÷ <span class="value">${formatNumber(v2)} Ω</span> = <strong>${formatNumber(current, 4)} A</strong>`;
      }

      if (q === 'resistance') {
        const resistance = v1 / v2;
        output = `Resistance = Voltage ÷ Current = <span class="value">${formatNumber(v1)} V</span> ÷ <span class="value">${formatNumber(v2)} A</span> = <strong>${formatNumber(resistance, 4)} Ω</strong>`;
      }

      if (q === 'power') {
        const power = v1 * v2;
        output = `Power = Voltage × Current = <span class="value">${formatNumber(v1)} V</span> × <span class="value">${formatNumber(v2)} A</span> = <strong>${formatNumber(power, 4)} W</strong>`;
      }

      resultBox.innerHTML = `<strong>Result:</strong> ${output}`;
    }

    function clearForm() {
      value1.value = '';
      value2.value = '';
      quantity.value = 'voltage';
      unit.value = 'base';
      resultBox.innerHTML = '<strong>Result:</strong> Choose values and press calculate.';
    }

    document.getElementById('calculate').addEventListener('click', calculate);
    document.getElementById('clear').addEventListener('click', clearForm);
  </script>
</body>
</html>
