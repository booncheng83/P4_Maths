<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Grammar Quiz for P4 Students</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f4f8, #f5f9fc);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .card {
      max-width: 700px;
      margin: auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      padding: 30px;
    }

    h1 { text-align: center; color: #2f6fed; }
    
    .question-box { margin-bottom: 25px; }
    .question-text { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; }
    
    .options-grid { display: grid; gap: 12px; }
    .option {
      padding: 14px 18px;
      border: 2px solid #e0e6eb;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .option:hover:not(.disabled) {
      border-color: #2f6fed;
      background: #f0f7ff;
    }
    
    .option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    
    .btn-next, .btn-restart {
      padding: 12px 30px;
      font-size: 1rem;
      background: #2f6fed;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-right: 15px;
    }
    
    .btn-next:hover, .btn-restart:hover { background: #1a58d0; }
    
    .progress { text-align: center; color: #6b7280; margin-bottom: 20px; font-weight: bold; }
    
    .result { text-align: center; padding: 30px; }
    .score { font-size: 2.5rem; color: #2f6fed; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🇸🇬 English Grammar Quiz for P4 Students</h1>
    <div class="progress" id="progress">Question 1 of 20</div>

    <div class="question-box" id="quiz">
      <div class="question-text" id="q-text"></div>
      <div class="options-grid" id="options"></div>
    </div>

    <div class="result" id="result" style="display:none;">
      <h2>🎉 Quiz Completed!</h2>
      <div class="score" id="final-score"></div>
      <p id="feedback-text"></p>
      <button class="btn-next" onclick="restartQuiz()">Try Again</button>
    </div>

    <button class="btn-next" id="next-btn" onclick="nextQuestion()" style="display:none; margin-top:15px;">Next Question →</button>
  </div>

  <script>
    const makeQuestion = (text, options, answer, explanation) => ({
      text,
      options,
      answer,
      explanation: '✓ Correct! ' + explanation
    });

    // A bank of P4-level questions covering common English grammar topics.
    const questions = [
      makeQuestion("Choose the correct verb: The boy _____ football every Saturday.", ["play", "plays", "playing"], 1, "A singular subject takes 'plays'."),
      makeQuestion("Choose the correct verb: The children _____ in the playground.", ["is", "are", "am"], 1, "A plural subject takes 'are'."),
      makeQuestion("Choose the correct verb: My mother _____ delicious noodles.", ["cook", "cooks", "cooking"], 1, "A singular subject takes 'cooks'."),
      makeQuestion("Choose the correct verb: Birds _____ in the sky.", ["flies", "fly", "flying"], 1, "A plural subject takes 'fly'."),
      makeQuestion("Choose the correct verb: Sarah _____ a storybook now.", ["read", "reads", "is reading"], 2, "'Is reading' shows an action happening now."),
      makeQuestion("Choose the correct verb: The dog _____ loudly last night.", ["bark", "barks", "barked"], 2, "'Barked' is the past-tense verb."),
      makeQuestion("Choose the correct verb: I _____ my homework yesterday.", ["finish", "finished", "finishes"], 1, "'Finished' shows an action in the past."),
      makeQuestion("Choose the correct verb: We _____ to the zoo tomorrow.", ["go", "went", "will go"], 2, "'Will go' shows a future action."),
      makeQuestion("Choose the correct verb: There _____ three apples in the basket.", ["is", "are", "was"], 1, 'A plural noun takes "are".'),
      makeQuestion("Choose the correct verb: Each pupil _____ a pencil.", ["have", "has", "having"], 1, "Each is singular, so use 'has'."),

      makeQuestion("Choose the past tense: Tom _____ the ball to Ali.", ["throw", "throws", "threw"], 2, "'Threw' is the past tense of throw."),
      makeQuestion("Choose the past tense: Mei Ling _____ a letter.", ["write", "wrote", "writes"], 1, "'Wrote' is the past tense of write."),
      makeQuestion("Choose the past tense: The cat _____ under the sofa.", ["hide", "hides", "hid"], 2, "'Hid' is the past tense of hide."),
      makeQuestion("Choose the past tense: We _____ a rainbow after the rain.", ["see", "saw", "sees"], 1, "'Saw' is the past tense of see."),
      makeQuestion("Choose the past tense: They _____ the race.", ["win", "won", "wins"], 1, "'Won' is the past tense of win."),
      makeQuestion("Choose the past tense: I _____ my hands before dinner.", ["wash", "washed", "washes"], 1, "'Washed' is the past tense."),
      makeQuestion("Choose the past tense: The baby _____ happily.", ["smile", "smiled", "smiles"], 1, "'Smiled' is the past tense."),
      makeQuestion("Choose the past tense: Ben _____ his lunch at noon.", ["eat", "eats", "ate"], 2, "'Ate' is the past tense of eat."),
      makeQuestion("Choose the past tense: The wind _____ the leaves away.", ["blow", "blew", "blows"], 1, "'Blew' is the past tense of blow."),
      makeQuestion("Choose the past tense: Siti _____ a beautiful song.", ["sing", "sang", "sings"], 1, "'Sang' is the past tense of sing."),

      makeQuestion("Choose the correct pronoun: _____ am going to the library.", ["I", "Me", "My"], 0, "'I' is used as the subject."),
      makeQuestion("Choose the correct pronoun: Please give the book to _____.", ["I", "me", "my"], 1, "'Me' follows the preposition to."),
      makeQuestion("Choose the correct pronoun: _____ is my best friend.", ["He", "Him", "His"], 0, "'He' is the subject of the sentence."),
      makeQuestion("Choose the correct pronoun: The teacher praised _____.", ["she", "her", "hers"], 1, "'Her' is the object of praised."),
      makeQuestion("Choose the correct pronoun: This bicycle belongs to _____.", ["they", "them", "their"], 1, "'Them' follows to."),
      makeQuestion("Choose the correct pronoun: _____ books are on the table.", ["They", "Them", "Their"], 2, "'Their' shows ownership."),
      makeQuestion("Choose the correct pronoun: Ali and I brought _____ lunch.", ["our", "us", "we"], 0, "'Our' shows ownership."),
      makeQuestion("Choose the correct pronoun: The red bag is _____.", ["my", "me", "mine"], 2, "'Mine' shows ownership."),
      makeQuestion("Choose the correct pronoun: The kitten washed _____.", ["itself", "it", "its"], 0, "'Itself' refers back to the kitten."),
      makeQuestion("Choose the correct pronoun: _____ are visiting Singapore.", ["We", "Us", "Our"], 0, "'We' is the subject."),

      makeQuestion("Choose the correct article: I saw _____ elephant at the zoo.", ["a", "an", "the"], 1, "Use 'an' before a vowel sound."),
      makeQuestion("Choose the correct article: She ate _____ banana.", ["a", "an", "the"], 0, "Use 'a' before a consonant sound."),
      makeQuestion("Choose the correct article: He is _____ honest boy.", ["a", "an", "the"], 1, "Honest begins with a vowel sound."),
      makeQuestion("Choose the correct article: Please pass me _____ salt.", ["a", "an", "the"], 2, "Use 'the' for the specific salt nearby."),
      makeQuestion("Choose the correct article: We saw _____ moon last night.", ["a", "an", "the"], 2, "There is one moon, so use 'the'."),
      makeQuestion("Choose the correct article: She wants _____ orange.", ["a", "an", "the"], 1, "Orange begins with a vowel sound."),
      makeQuestion("Choose the correct article: I need _____ pencil.", ["a", "an", "the"], 0, "Pencil begins with a consonant sound."),
      makeQuestion("Choose the correct article: He waited for _____ hour.", ["a", "an", "the"], 1, "Hour begins with a vowel sound."),
      makeQuestion("Choose the correct article: _____ sun is very bright.", ["A", "An", "The"], 2, "There is one sun, so use 'The'."),
      makeQuestion("Choose the correct article: She found _____ coin on the floor.", ["a", "an", "the"], 0, "Coin begins with a consonant sound."),

      makeQuestion("Choose the correct preposition: The book is _____ the table.", ["on", "at", "by"], 0, "'On' shows the book is touching the table."),
      makeQuestion("Choose the correct preposition: The pupils are _____ the classroom.", ["in", "on", "at"], 0, "'In' shows they are inside."),
      makeQuestion("Choose the correct preposition: We will meet _____ Monday.", ["in", "on", "at"], 1, "Use 'on' with days."),
      makeQuestion("Choose the correct preposition: Dad wakes up _____ 6 a.m.", ["in", "on", "at"], 2, "Use 'at' with a specific time."),
      makeQuestion("Choose the correct preposition: Singapore is _____ Malaysia and Indonesia.", ["between", "under", "during"], 0, "'Between' is used for two places."),
      makeQuestion("Choose the correct preposition: The fish swims _____ the water.", ["under", "in", "at"], 1, "'In' shows the fish is inside the water."),
      makeQuestion("Choose the correct preposition: The bus travelled _____ the tunnel.", ["through", "on", "at"], 0, "'Through' means from one side to the other."),
      makeQuestion("Choose the correct preposition: Please stand _____ me in the queue.", ["behind", "during", "into"], 0, "'Behind' shows position in the queue."),
      makeQuestion("Choose the correct preposition: The bird flew _____ the tree.", ["over", "at", "during"], 0, "'Over' shows movement above the tree."),
      makeQuestion("Choose the correct preposition: We play football _____ the evening.", ["on", "in", "at"], 1, "Use 'in' with parts of the day."),

      makeQuestion("Choose the plural noun: one child, two _____.", ["childs", "children", "childes"], 1, "'Children' is the irregular plural."),
      makeQuestion("Choose the plural noun: one tooth, two _____.", ["tooths", "teeth", "toothes"], 1, "'Teeth' is the irregular plural."),
      makeQuestion("Choose the plural noun: one box, two _____.", ["boxs", "boxes", "boxies"], 1, "Add 'es' to make boxes."),
      makeQuestion("Choose the plural noun: one baby, two _____.", ["babys", "babies", "babyes"], 1, "Change y to ies: babies."),
      makeQuestion("Choose the plural noun: one leaf, two _____.", ["leafs", "leaves", "leafes"], 1, "'Leaves' is the correct plural."),
      makeQuestion("Choose the plural noun: one man, two _____.", ["mans", "men", "mens"], 1, "'Men' is the irregular plural."),
      makeQuestion("Choose the plural noun: one bus, two _____.", ["buss", "buses", "busies"], 1, "Add 'es' to make buses."),
      makeQuestion("Choose the plural noun: one mouse, two _____.", ["mouses", "mice", "mices"], 1, "'Mice' is the irregular plural."),
      makeQuestion("Choose the plural noun: one knife, two _____.", ["knifes", "knives", "knifees"], 1, "Change fe to ves: knives."),
      makeQuestion("Choose the plural noun: one tomato, two _____.", ["tomatos", "tomatoes", "tomaties"], 1, "Add 'es' to make tomatoes."),

      makeQuestion("Choose the adjective: The _____ kitten slept.", ["soft", "sleep", "softly"], 0, "'Soft' describes the kitten."),
      makeQuestion("Choose the adjective: We saw a _____ rainbow.", ["colourful", "colourfully", "colour"], 0, "'Colourful' describes the rainbow."),
      makeQuestion("Choose the adjective: The soup is _____.", ["hot", "heat", "heats"], 0, "'Hot' describes the soup."),
      makeQuestion("Choose the adverb: The tortoise walked _____.", ["slow", "slowly", "slowness"], 1, "'Slowly' describes how it walked."),
      makeQuestion("Choose the adverb: She sang _____.", ["beautiful", "beauty", "beautifully"], 2, "'Beautifully' describes how she sang."),
      makeQuestion("Choose the adjective: It was a _____ day.", ["sun", "sunny", "sunnily"], 1, "'Sunny' describes the day."),
      makeQuestion("Choose the adverb: The boy answered the question _____.", ["correct", "correctly", "correction"], 1, "'Correctly' describes how he answered."),
      makeQuestion("Choose the adjective: The lion is _____.", ["brave", "bravely", "bravery"], 0, "'Brave' describes the lion."),
      makeQuestion("Choose the adverb: The students listened _____.", ["careful", "carefully", "care"], 1, "'Carefully' describes how they listened."),
      makeQuestion("Choose the adjective: The puzzle was _____.", ["challenging", "challenge", "challengingly"], 0, "'Challenging' describes the puzzle."),

      makeQuestion("Choose the conjunction: I brought an umbrella _____ it was raining.", ["because", "or", "but"], 0, "'Because' gives the reason."),
      makeQuestion("Choose the conjunction: Would you like tea _____ juice?", ["and", "or", "because"], 1, "'Or' gives a choice."),
      makeQuestion("Choose the conjunction: I wanted to play, _____ I was ill.", ["and", "but", "so"], 1, "'But' shows contrast."),
      makeQuestion("Choose the conjunction: It was hot, _____ we drank water.", ["so", "or", "but"], 0, "'So' shows a result."),
      makeQuestion("Choose the conjunction: Sam _____ Ali cleaned the room.", ["and", "because", "if"], 0, "'And' joins two subjects."),
      makeQuestion("Choose the conjunction: We stayed indoors _____ the storm ended.", ["until", "or", "and"], 0, "'Until' shows the time something continued."),
      makeQuestion("Choose the conjunction: _____ you study, you will improve.", ["If", "But", "Or"], 0, "'If' introduces a condition."),
      makeQuestion("Choose the conjunction: I wore a jacket _____ it was cold.", ["because", "and", "or"], 0, "'Because' gives the reason."),
      makeQuestion("Choose the conjunction: Hurry up, _____ we will miss the bus.", ["or", "and", "because"], 0, "'Or' shows a possible result."),
      makeQuestion("Choose the conjunction: The cake is small _____ delicious.", ["but", "so", "if"], 0, "'But' shows contrast."),

      makeQuestion("Choose the sentence with correct capitalisation.", ["my name is ali.", "My name is Ali.", "my Name is ali."], 1, "Start with a capital letter and capitalise names."),
      makeQuestion("Choose the sentence with correct punctuation.", ["Where are you.", "Where are you?", "Where are you!"], 1, "A question ends with a question mark."),
      makeQuestion("Choose the sentence with correct punctuation.", ["What a beautiful view!", "What a beautiful view?", "What a beautiful view."], 0, "An exclamation shows strong feeling."),
      makeQuestion("Choose the sentence with correct punctuation.", ["I bought apples oranges and pears.", "I bought apples, oranges and pears.", "I bought apples oranges, and pears"], 1, "Use commas to separate items in a list."),
      makeQuestion("Choose the sentence with correct punctuation.", ["Stop!", "Stop?", "Stop,"], 0, "An exclamation mark gives a strong command."),
      makeQuestion("Choose the sentence with correct capitalisation.", ["We visited sentosa island.", "We visited Sentosa Island.", "we visited Sentosa island."], 1, "Names of places begin with capital letters."),
      makeQuestion("Choose the sentence with correct punctuation.", ["Mum said, \"Come here.\"", "Mum said \"Come here\".", "Mum said, Come here."], 0, "Use a comma and quotation marks for speech."),
      makeQuestion("Choose the sentence with correct capitalisation.", ["On monday, I read a book.", "On Monday, I read a book.", "On monday, i read a book."], 1, "Days and the pronoun I use capital letters."),
      makeQuestion("Choose the sentence with correct punctuation.", ["The dog is brown.", "The dog is brown?", "The dog is brown!"], 0, "A statement ends with a full stop."),
      makeQuestion("Choose the sentence with correct punctuation.", ["Can you help me?", "Can you help me.", "Can you help me!"], 0, "A question ends with a question mark."),

      makeQuestion("Choose the correct spelling.", ["becaus", "because", "becose"], 1, "The correct spelling is because."),
      makeQuestion("Choose the correct spelling.", ["receive", "recieve", "receeve"], 0, "The correct spelling is receive."),
      makeQuestion("Choose the correct spelling.", ["friend", "freind", "frend"], 0, "The correct spelling is friend."),
      makeQuestion("Choose the correct spelling.", ["different", "diffrent", "difarent"], 0, "The correct spelling is different."),
      makeQuestion("Choose the correct spelling.", ["necessary", "neccessary", "necessery"], 0, "The correct spelling is necessary."),
      makeQuestion("Choose the correct spelling.", ["library", "libary", "librery"], 0, "The correct spelling is library."),
      makeQuestion("Choose the correct spelling.", ["Wednesday", "Wensday", "Wednsday"], 0, "The correct spelling is Wednesday."),
      makeQuestion("Choose the correct spelling.", ["surprise", "suprise", "surprize"], 0, "The correct spelling is surprise."),
      makeQuestion("Choose the correct spelling.", ["environment", "enviroment", "envirenment"], 0, "The correct spelling is environment."),
      makeQuestion("Choose the correct spelling.", ["beautiful", "beutiful", "beautifull"], 0, "The correct spelling is beautiful.")
    ].slice(0, 20);

    const totalQuestions = questions.length;

    let qIndex = 0;
    let score = 0;

    function loadQuestion() {
      document.getElementById('progress').textContent = 'Question ' + (qIndex + 1) + ' of ' + totalQuestions;
      
      const q = questions[qIndex];
      document.getElementById('q-text').innerHTML = q.text;
      document.getElementById('next-btn').style.display = 'none';
      
      const opts = document.getElementById('options');
      opts.innerHTML = '';
      
      q.options.forEach((opt, i) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = opt;
        div.onclick = () => checkAnswer(i, div);
        opts.appendChild(div);
      });
    }

    function checkAnswer(selected, element) {
      const q = questions[qIndex];
      const allOpts = document.querySelectorAll('.option');
      
      // Disable all options
      allOpts.forEach(opt => opt.classList.add('disabled', 'option'));
      
      if (selected === q.answer) {
        score++;
        element.classList.add('correct');
      } else {
        element.classList.add('wrong');
        allOpts[q.answer].classList.add('correct');
      }
      
      document.getElementById('progress').textContent = q.explanation;
      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
      qIndex++;
      if (qIndex < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      document.getElementById('progress').textContent = '';
      
      const percentage = (score / questions.length) * 100;
      let message = '';
      
      if (percentage === 100) {
        document.getElementById('final-score').textContent = score + ' / ' + totalQuestions;
        message = 'Amazing! You are a grammar superstar! ⭐⭐⭐';
      } else if (percentage >= 60) {
        document.getElementById('final-score').textContent = score + ' / ' + totalQuestions;
        message = 'Good job! Keep practicing! ⭐';
      } else {
        document.getElementById('final-score').textContent = score + ' / ' + totalQuestions;
        message = 'Don\'t give up! You will improve with practice! 💪';
      }
      
      document.getElementById('feedback-text').textContent = message;
    }

    function restartQuiz() {
      qIndex = 0;
      score = 0;
      document.getElementById('quiz').style.display = 'block';
      document.getElementById('result').style.display = 'none';
      loadQuestion();
    }

    // Start quiz
    loadQuestion();
  </script>
</body>
</html>
