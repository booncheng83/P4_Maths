<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Grammar Quiz for P4 Students</title>
  <style>
    :root {
      --primary: #2f6fed;
      --primary-light: #e8f3ff;
      --success: #27ae60;
      --error: #e74c3c;
      --text: #1f2937;
      --muted: #6b7280;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', Arial, sans-serif;
      background: linear-gradient(135deg, #eaf2ff, #f7f9fc);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      width: min(95vw, 600px);
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      color: var(--primary);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .progress-bar {
      background: var(--primary-light);
      border-radius: 10px;
      height: 20px;
      margin-bottom: 25px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #5ab4f8);
      width: 0%;
      transition: width 0.3s ease;
    }

    .quiz-container {
      margin-bottom: 20px;
    }

    .question {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 25px;
      line-height: 1.4;
      color: var(--text);
      padding: 20px;
      background: #f8fafc;
      border-radius: 15px;
      border-left: 5px solid var(--primary);
    }

    .options {
      display: grid;
      gap: 15px;
      margin-bottom: 25px;
    }

    .option {
      padding: 18px 20px;
      border: 2px solid var(--primary-light);
      border-radius: 12px;
      background: white;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-weight: 500;
    }

    .option:hover:not(:disabled) {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .option.selected-correct {
      background: #d4edda;
      border-color: var(--success);
      color: var(--success);
    }

    .option.selected-wrong {
      background: #f8d7da;
      border-color: var(--error);
      color: var(--error);
    }

    .option:disabled {
      cursor: not-allowed;
    }

    .feedback {
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: 600;
      display: none;
    }

    .feedback.correct {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .feedback.incorrect {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .btn-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    button {
      padding: 14px 32px;
      font-size: 1.1rem;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #1a58d0;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(47, 111, 237, 0.3);
    }

    .btn-secondary {
      background: var(--primary-light);
      color: var(--primary);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #d0e4ff;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-box {
      text-align: center;
      padding: 30px;
      display: none;
    }

    .score-display {
      font-size: 3rem;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 15px;
    }

    .score-text {
      font-size: 1.4rem;
      color: var(--text);
      margin-bottom: 25px;
    }

    .stars {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    /* Singapore-themed decoration */
    .decorations {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .decoration {
      position: absolute;
      font-size: 10rem;
      opacity: 0.05;
      z-index: -1;
    }

    .decoration:nth-child(1) { top: 10%; left: 5%; transform: rotate(-15deg); }
    .decoration:nth-child(2) { top: 20%; right: 8%; transform: rotate(10deg); }
    .decoration:nth-child(3) { bottom: 15%; left: 10%; transform: rotate(5deg); }
    .decoration:nth-child(4) { bottom: 5%; right: 12%; transform: rotate(-8deg); }

    /* Fun animations */
    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .question {
      animation: popIn 0.4s ease;
    }

    @media (max-width: 500px) {
      h1 { font-size: 1.6rem; }
      .question { font-size: 1.1rem; padding: 15px; }
      .option { padding: 14px 18px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="decorations">
    <span class="decoration">✏️</span>
    <span class="decoration">📚</span>
    <span class="decoration">⭐</span>
    <span class="decoration">🎓</span>
  </div>

  <div class="card" id="quiz-card">
    <header>
      <h1>🇸🇬 English Grammar Quiz for P4</h1>
      <p class="subtitle">Let's test your grammar skills! You have 5 questions.</p>
    </header>

    <div class="progress-bar" id="progress-bar" style="display: none;">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <div class="quiz-container">
      <div class="question" id="question-text"></div>
      <div class="options" id="options-container"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="btn-container" id="btn-container">
      <button class="btn-primary" id="next-btn" style="display: none;">Next Question →</button>
      <button class="btn-secondary" id="restart-btn" style="display: none;">Restart Quiz ↺</button>
    </div>

    <div class="result-box" id="result-box">
      <h2>🎉 Great Job!</h2>
      <div class="score-display" id="score"></div>
      <div class="stars" id="stars"></div>
      <p class="score-text" id="score-message"></p>
      <button class="btn-primary" onclick="restartQuiz()">Try Again 🎯</button>
    </div>
  </div>

  <script>
    // Quiz questions tailored for P4 Singapore students
    const questions = [
      {
        question: "Choose the correct spelling:",
        options: ["Beuatyful", "Beautiful", "Bautifuly"],
        correct: 1,
        explanation: "Great job! 'Beautiful' is spelled with one 't' and one 'l'."
      },
      {
        question: "Pick the right verb tense for this sentence:\n\"She _____ to school every day.\"",
        options: ["go", "goes", "going"],
        correct: 1,
        explanation: "Well done! Third person singular 'she' needs 'goes'."
      },
      {
        question: "Which word is an adjective? (A word that describes a noun)",
        options: ["run", "quickly", "blue"],
        correct: 2,
        explanation: "Correct! 'Blue' describes the colour of something."
      },
      {
        question: "Choose the right conjunction:",
        options: ["She sings _____ dances.", "She sings but dances.", "She sings and dances."],
        correct: 2,
        explanation: "Well done! 'And' is used to connect two similar actions."
      },
      {
        question: "Which sentence is complete (has a subject AND verb)?",
        options: ["At the park.", "The cat jumps.", "Jumping fast."],
        correct: 1,
        explanation: "Perfect! It tells WHO (cat) does WHAT (jumps)."
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    // Load elements
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedback = document.getElementById('feedback');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');
    const btnContainer = document.getElementById('btn-container');
    const quizCard = document.getElementById('quiz-card');

    // Start quiz
    function startQuiz() {
      currentQuestion = 0;
      score = 0;
      progressBar.style.display = 'block';
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      const q = questions[currentQuestion];
      
      // Update progress bar
      const progress = (currentQuestion / questions.length) * 100;
      progressFill.style.width = progress + '%';
      
      // Show question
      questionText.innerHTML = '<strong>Question ' + (currentQuestion + 1) + '</strong>: ' + q.question;
      
      // Create options
      optionsContainer.innerHTML = '';
      q.options.forEach((option, index) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option';
        optionDiv.textContent = option;
        optionDiv.onclick = () => checkAnswer(index, optionDiv);
        optionsContainer.appendChild(optionDiv);
      });

      // Hide feedback and button
      feedback.style.display = 'none';
      nextBtn.style.display = 'none';
    }

    function checkAnswer(selectedIndex, selectedElement) {
      if (answered) return;
      
      answered = true;
      const q = questions[currentQuestion];
      const options = optionsContainer.children;

      // Disable all options
      for (let i = 0; i < options.length; i++) {
        options[i].setAttribute('disabled', 'true');
      }

      // Highlight selected and correct/incorrect
      if (selectedIndex === q.correct) {
        score++;
        selectedElement.classList.add('selected-correct');
        feedback.className = 'feedback correct';
        feedback.innerHTML = '<strong>✓ Correct!</strong> ' + q.explanation;
      } else {
        selectedElement.classList.add('selected-wrong');
        options[q.correct].classList.add('selected-correct');
        feedback.className = 'feedback incorrect';
        feedback.innerHTML = '<strong>✗ Oops!</strong> ' + q.explanation;
      }

      // Show feedback and button
      feedback.style.display = 'block';
      nextBtn.style.display = 'inline-block';
    }

    function showNextQuestion() {
      currentQuestion++;
      
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      progressBar.style.display = 'none';
      quizCard.querySelector('.quiz-container').style.display = 'none';
      btnContainer.innerHTML = ''; // Clear next button
      
      const percentage = (score / questions.length) * 100;
      let stars = '', message = '';

      if (percentage === 100) {
        stars = '⭐⭐⭐';
        message = 'Amazing! You are a grammar superstar! 🌟🇸🇬';
      } else if (percentage >= 80) {
        stars = '⭐⭐';
        message = 'Excellent work! Keep practicing! 👍';
      } else if (percentage >= 60) {
        stars = '⭐';
        message = 'Good effort! You can do better next time! 💪';
      } else {
        stars = '';
        message = 'Don\'t give up! Keep studying and you will improve! 📚';
      }

      document.getElementById('score').textContent = score + ' / ' + questions.length;
      document.getElementById('stars').textContent = stars;
      document.getElementById('score-message').textContent = message;
      
      // Show result box
      quizCard.querySelector('.result-box').style.display = 'block';
    }

    function restartQuiz() {
      currentQuestion = 0;
      score = 0;
      quizCard.querySelector('.quiz-container').style.display = 'block';
      quizCard.querySelector('.result-box').style.display = 'none';
      btnContainer.innerHTML = `
        <button class="btn-primary" id="next-btn" style="display: inline-block;" onclick="showNextQuestion()">Next Question →</button>
      `;
      
      // Reattach event listener
      nextBtn.onclick = showNextQuestion;
      
      startQuiz();
    }

    // Initialize
    document.getElementById('restart-btn').style.display = 'none';
    startQuiz();
  </script>
</body>
</html>
